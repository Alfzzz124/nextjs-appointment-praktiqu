  /api/v1/encounters/{id}/documents:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 55
    get:
      tags:
        - encounters
      summary: Documents visible from an encounter
      operationId: get_api_v1_encounters_id_documents
      description: >-
        Two sections. `sessionDocuments` holds the files that arrived with the booking plus documents linked
        to this encounter. `patientDocuments` holds the rest of the patient's archive and is paginated.


        **Capability:** `patient_report_read`


        **Response envelope:** KC `{status,message,data}`
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Documents retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      sessionDocuments:
                        type: array
                        items:
                          $ref: '#/components/schemas/EncounterDocument'
                      patientDocuments:
                        type: array
                        items:
                          $ref: '#/components/schemas/EncounterDocument'
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                          perPage:
                            type: integer
                          total:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
    post:
      tags:
        - encounters
      summary: Upload a document and attach it to this encounter
      operationId: post_api_v1_encounters_id_documents
      description: |-
        Staff only. jpg, jpeg, png, webp, gif or pdf, up to 10 MB.

        **Capability:** `patient_report_manage`

        **Response envelope:** KC `{status,message,data}`
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                  example: Resume sesi konseling
      responses:
        '200':
          description: >-
            Uploaded. `linked: false` means the document reached the patient archive but its tie to this
            encounter could not be written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: The new patient-medical-report id.
                      mediaId:
                        type: integer
                        description: The WordPress attachment id backing the file.
                      linked:
                        type: boolean
                        description: >-
                          False when the document was saved to the patient archive but the link to this
                          encounter could not be written.
        '400':
          description: >-
            Malformed request, for one of two reasons: the body was not `multipart/form-data` ("Expected
            multipart/form-data"), or no `file` field was present in the form ("No file provided").
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not permitted — upload is staff only
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: File rejected by type or size validation
      security:
        - bearerAuth: []
