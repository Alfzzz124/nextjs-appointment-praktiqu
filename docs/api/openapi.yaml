  /api/v1/professional-sessions/grouped:
    get:
      tags:
        - professional-sessions
      summary: List schedules, one row per professional and clinic
      operationId: get_api_v1_professional_sessions_grouped
      description: |-
        The shape the scheduling list screen renders: a professional working Monday and Tuesday
        with a lunch break is four stored rows but one line here. Rows of 00:00:00-00:00:00
        (legacy KiviCare junk) are excluded.

        **Capability:** `doctor_session_read`

        **Response envelope:** KC `{status,message,data}`
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: perPage
          in: query
          schema:
            type: integer
            default: 10
        - name: clinicId
          in: query
          schema:
            type: integer
        - name: doctorId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          description: Matches doctor display name or clinic name.
          schema:
            type: string
        - name: orderBy
          in: query
          schema:
            type: string
            enum:
              - doctor_name
              - clinic_name
              - time_slot
            default: doctor_name
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
      responses:
        '200':
          description: Grouped schedules
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/KcEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessions:
                            type: array
                            items:
                              $ref: '#/components/schemas/DoctorSessionGroup'
                          pagination:
                            type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - bearerAuth: []
