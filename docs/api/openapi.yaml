  /api/v1/doctor-sessions/week:
    get:
      tags:
        - professional-sessions
      summary: Read one doctor's week at one clinic
      operationId: get_api_v1_professional_sessions_week_alias
      description: >-
        Returns all seven days, each either disabled or carrying a session and its breaks.

        A doctor with no schedule yet is not an error - the "add" form asks for exactly

        this and gets seven disabled days.


        `clinicId` is required for a SUPER_ADMIN and derived from the actor for everyone

        else.


        **Capability:** `doctor_session_read`


        **Response envelope:** KC `{status,message,data}`


        **Deprecated.** Use the same operation under `/api/v1/professional-sessions`. This path is an alias
        kept for existing integrations and will be removed.
      parameters:
        - name: doctorId
          in: query
          required: true
          schema:
            type: integer
        - name: clinicId
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: The week, in the shape the form binds to
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/KcEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DoctorSessionWeek'
        '400':
          description: doctorId or clinicId missing
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - bearerAuth: []
      deprecated: true
    put:
      tags:
        - professional-sessions
      summary: Replace one doctor's whole week at one clinic
      operationId: put_api_v1_professional_sessions_week_alias
      description: >-
        Replaces every stored row for that (doctor, clinic) in one transaction: what the

        screen submits *is* the schedule, so a day left out is a day removed.


        A day with breaks is stored as several rows with the breaks as the gaps between

        them; the service does that split. Rules enforced here match the ones the form

        shows: at least one enabled day, session at least 30 minutes, break at least 15

        minutes, breaks inside the session and not overlapping each other. A violation is

        a `400` whose `message` is the sentence to show the user.


        **Capability:** `doctor_session_manage`


        **Response envelope:** KC `{status,message,data}`


        **Deprecated.** Use the same operation under `/api/v1/professional-sessions`. This path is an alias
        kept for existing integrations and will be removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorSessionWeekSave'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KcEnvelope'
        '400':
          description: A validation rule failed; `message` is user-facing
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - bearerAuth: []
      deprecated: true
    delete:
      tags:
        - professional-sessions
      summary: Delete one doctor's whole schedule at one clinic
      operationId: delete_api_v1_professional_sessions_week_alias
      description: >-
        **Capability:** `doctor_session_manage`


        **Response envelope:** KC `{status,message,data}`


        **Deprecated.** Use the same operation under `/api/v1/professional-sessions`. This path is an alias
        kept for existing integrations and will be removed.
      parameters:
        - name: doctorId
          in: query
          required: true
          schema:
            type: integer
        - name: clinicId
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KcEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - bearerAuth: []
      deprecated: true
