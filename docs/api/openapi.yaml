  /api/v1/sessions/{id}/attachments/{mediaId}/content:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 77
      - name: mediaId
        in: path
        required: true
        schema:
          type: integer
        example: 301
    get:
      tags:
        - sessions
      summary: Stream a file that arrived with the booking
      operationId: get_api_v1_sessions_id_attachments_mediaId_content
      description: >-
        Two independent checks gate this route, and they answer differently on purpose. Loading the session
        itself is scoped by `getSession`: if the session is not the caller's, that's a `403` — the caller
        already knows the session id is real, so confirming it exists costs nothing. Whether `mediaId`
        actually belongs to that session's booking is checked separately and deliberately answers `404`, not
        `403`, when it doesn't — a `403` there would confirm to the caller that the media id exists (just not
        for them), which a stray or guessed id should not be able to learn.
      responses:
        '200':
          description: The file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The session itself is not the caller's
        '404':
          description: Either the session has no attachment with this media id, or the underlying file is gone
      security:
        - bearerAuth: []
