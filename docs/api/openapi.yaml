components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    webhookSignature:
      type: apiKey
      in: header
      name: X-PraktiQU-Webhook-Signature
      description: HMAC signature of the raw request body, verified by verifyPaymentWebhookSignature. Not a bearer JWT.
  schemas:
    DoctorSessionGroup:
      type: object
      description: One doctor's schedule at one clinic, as the list screen shows it.
      properties:
        id:
          type: integer
          description: An addressable row of the group; the group itself is keyed by doctor_id + clinic_id.
        doctor_id:
          type: integer
        clinic_id:
          type: integer
        doctor_name:
          type: string
          nullable: true
        doctor_email:
          type: string
          nullable: true
        clinic_name:
          type: string
          nullable: true
        clinic_email:
          type: string
          nullable: true
        days:
          type: array
          description: Days worked, in week order.
          items:
            type: string
            enum:
              - mon
              - tue
              - wed
              - thu
              - fri
              - sat
              - sun
        time_slot:
          type: integer
          nullable: true
          description: Appointment length in minutes.
        window_count:
          type: integer
          description: Stored rows behind this line - more than one per day when the day has breaks.
    DoctorSessionTimeRange:
      type: object
      properties:
        start:
          type: string
          example: '09:00'
        end:
          type: string
          example: '17:00'
      required:
        - start
        - end
    DoctorSessionWeekDay:
      type: object
      properties:
        day:
          type: string
          enum:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
        enabled:
          type: boolean
        mainSession:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DoctorSessionTimeRange'
        breaks:
          type: array
          items:
            $ref: '#/components/schemas/DoctorSessionTimeRange'
    DoctorSessionWeek:
      type: object
      description: A doctor's week at one clinic, in the shape the scheduling form binds to.
      properties:
        doctor_id:
          type: integer
        clinic_id:
          type: integer
        doctor_name:
          type: string
          nullable: true
        clinic_name:
          type: string
          nullable: true
        time_slot:
          type: integer
          description: Appointment length in minutes; falls back to the module default when no schedule exists yet.
        days:
          type: array
          description: Always seven entries, Monday first.
          items:
            $ref: '#/components/schemas/DoctorSessionWeekDay'
    DoctorSessionWeekSave:
      type: object
      properties:
        doctorId:
          type: integer
        clinicId:
          type: integer
          description: Required for a SUPER_ADMIN; derived from the actor otherwise.
        timeSlot:
          type: integer
          minimum: 1
          maximum: 240
          default: 30
        days:
          type: array
          minItems: 1
          maxItems: 7
          description: Days omitted here are removed from the schedule.
          items:
            type: object
            properties:
              day:
                type: string
                enum:
                  - mon
                  - tue
                  - wed
                  - thu
                  - fri
                  - sat
                  - sun
              enabled:
                type: boolean
              mainSession:
                nullable: true
                description: Required when enabled. HH:MM or HH:MM:SS.
                allOf:
                  - $ref: '#/components/schemas/DoctorSessionTimeRange'
              breaks:
                type: array
                maxItems: 12
                items:
                  $ref: '#/components/schemas/DoctorSessionTimeRange'
            required:
              - day
      required:
        - doctorId
        - days
    KcEnvelope:
      type: object
      properties:
        status:
          type: boolean
          example: true
        message:
          type: string
        data: {}
      required:
        - status
    StandardResponse:
      type: object
      description: Standard modules return the entity directly or under `data`.
      properties:
        data: {}
    Problem:
      type: object
      description: RFC-7807 problem detail.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    UploadResult:
      type: object
      description: One entry per submitted file, in the order the files were sent.
      properties:
        files:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              mediaId:
                type: integer
                description: WordPress attachment ID. Present when this file sideloaded successfully.
              url:
                type: string
                description: Present when this file sideloaded successfully.
              error:
                type: string
                description: Present when this file failed to sideload.
      required:
        - files
    PaymentStatusView:
      type: object
      description: Current payment order status for an appointment or bill.
      properties:
        status:
          type: string
          enum:
            - pending
            - paid
            - failed
            - expired
            - cancelled
        expectedAmount:
          type: number
          description: Amount (IDR) expected for this payment order.
      required:
        - status
        - expectedAmount
    CheckoutUrlResult:
      type: object
      properties:
        checkoutUrl:
          type: string
      required:
        - checkoutUrl
    SessionPaymentEnsureResult:
      allOf:
        - $ref: '#/components/schemas/PaymentStatusView'
        - type: object
          properties:
            checkoutUrl:
              type: string
              nullable: true
              description: >-
                Present when a fresh checkout was created; null when an existing non-terminal order's status
                was returned instead.
          required:
            - checkoutUrl
    UploadValidationProblem:
      description: >-
        RFC-7807 problem, optionally carrying a per-file breakdown. `files` is present when validation
        failures or sideload failures are attributable to specific files (e.g. a magic-byte/extension
        mismatch); it is absent for request-level failures (e.g. more than 10 files sent).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            files:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  error:
                    type: string
    EncounterDocument:
      type: object
      properties:
        id:
          type: integer
          description: Report id, or the WP attachment id when source is `booking`.
        source:
          type: string
          enum:
            - booking
            - report
        name:
          type: string
        filename:
          type: string
        mimeType:
          type: string
          nullable: true
        date:
          type: string
          nullable: true
          example: '2026-08-24'
        contentPath:
          type: string
          example: /api/v1/patient-medical-reports/12/content
        canManage:
          type: boolean
          description: >-
            False for every `booking` document — `appointment_report` is never written by this API, so rename
            and delete do not apply to them.
        missing:
          type: boolean
          description: The attachment row is gone from WordPress; the entry is kept so the loss is visible.
  responses:
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but lacks the required capability/role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
