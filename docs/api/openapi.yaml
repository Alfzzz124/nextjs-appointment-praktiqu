  /api/v1/clients:
    get:
      tags:
        - clients
      summary: List clients
      description: >-
        Patients from `wp_users` carrying the `kiviCare_patient` capability. Scoped to the actor's clinic
        unless the actor is a SUPER_ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type: string
            minLength: 1
            maxLength: 100
          required: false
          name: search
          in: query
        - schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
              - ARCHIVED
          required: false
          name: status
          in: query
      responses:
        '200':
          description: Paginated clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        uniqueClientId:
                          type: string
                          nullable: true
                        fullName:
                          type: string
                        email:
                          type: string
                          format: email
                        mobileNumber:
                          type: string
                          nullable: true
                        status:
                          type: string
                          enum:
                            - ACTIVE
                            - INACTIVE
                            - ARCHIVED
                        sessionCount:
                          type: integer
                        createdAt:
                          type: string
                          format: date-time
                      required:
                        - id
                        - uniqueClientId
                        - fullName
                        - email
                        - mobileNumber
                        - status
                        - sessionCount
                        - createdAt
                  pagination:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                      totalPages:
                        type: integer
                      totalItems:
                        type: integer
                      itemsPerPage:
                        type: integer
                    required:
                      - currentPage
                      - totalPages
                      - totalItems
                      - itemsPerPage
                required:
                  - data
                  - pagination
        '401':
          description: RFC-7807 problem detail
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                required:
                  - type
                  - title
                  - status
        '403':
          description: RFC-7807 problem detail
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                required:
                  - type
                  - title
                  - status
    post:
      tags:
        - clients
      summary: Register a client
      description: >-
        Creates a WordPress user with the `kiviCare_patient` capability via the praktiqu-endpoint plugin, so
        KiviCare's `kc_patient_save` listeners fire and the welcome email is sent.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  minLength: 1
                  maxLength: 100
                email:
                  type: string
                  minLength: 1
                  maxLength: 255
                  format: email
                mobileNumber:
                  type: string
                  minLength: 1
                  pattern: ^\+?\d{8,20}$
                dateOfBirth:
                  type: string
                  minLength: 1
                gender:
                  type: string
                  enum:
                    - MALE
                    - FEMALE
                    - OTHER
                address:
                  anyOf:
                    - type: string
                      maxLength: 500
                    - type: string
                      enum:
                        - ''
                emergencyContact:
                  anyOf:
                    - type: string
                      maxLength: 100
                    - type: string
                      enum:
                        - ''
                notes:
                  anyOf:
                    - type: string
                      maxLength: 1000
                    - type: string
                      enum:
                        - ''
              required:
                - fullName
                - email
                - mobileNumber
                - dateOfBirth
                - gender
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: WordPress user ID (wp_users.ID)
                      clinicId:
                        type: integer
                        nullable: true
                      uniqueClientId:
                        type: string
                        nullable: true
                        description: patient_unique_id meta, e.g. "PAT-0001"
                      fullName:
                        type: string
                      email:
                        type: string
                        format: email
                      mobileNumber:
                        type: string
                        nullable: true
                      dateOfBirth:
                        type: string
                        nullable: true
                        description: YYYY-MM-DD
                      gender:
                        type: string
                        nullable: true
                      address:
                        type: string
                        nullable: true
                      emergencyContact:
                        type: string
                        nullable: true
                      notes:
                        type: string
                        nullable: true
                      status:
                        type: string
                        enum:
                          - ACTIVE
                          - INACTIVE
                          - ARCHIVED
                      createdAt:
                        type: string
                        format: date-time
                      sessionCount:
                        type: integer
                        description: KiviCare appointments for this patient
                    required:
                      - id
                      - clinicId
                      - uniqueClientId
                      - fullName
                      - email
                      - mobileNumber
                      - dateOfBirth
                      - gender
                      - address
                      - emergencyContact
                      - notes
                      - status
                      - createdAt
                      - sessionCount
                required:
                  - data
        '400':
          description: RFC-7807 problem detail
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                required:
                  - type
                  - title
                  - status
        '401':
          description: RFC-7807 problem detail
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                required:
                  - type
                  - title
                  - status
        '403':
          description: RFC-7807 problem detail
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                required:
                  - type
                  - title
                  - status
        '409':
          description: Email already registered
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                required:
                  - type
                  - title
                  - status
        '422':
          description: RFC-7807 problem detail
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
