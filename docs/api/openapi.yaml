        **Response envelope:** KC `{status,message,data}`
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KcEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - bearerAuth: []
    post:
      tags:
        - patient-medical-reports
      summary: Create patient medical reports — REMOVED, now always 501
      operationId: post_api_v1_patient_medical_reports
      description: |-
        **Breaking change:** this route unconditionally returns `501` and creates
        nothing. It used to accept a WordPress media id directly in the body, but
        nothing tied that id to `patientId`, so any caller could mint a report row
        over another clinic's uploaded file and then read its bytes back via
        `GET /api/v1/patient-medical-reports/{id}/content`. The media-id field was
        removed; there is no replacement field to send here.

        **Use instead:** `POST /api/v1/encounters/{id}/documents` (multipart),
        which uploads the file's bytes itself and links the resulting document to
        the encounter in the same request.

        **Capability:** `patient_report_manage`

        **Response envelope:** KC `{status,message,data}`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          description: >-
            Always returned. "Creating a report requires uploading its file first. Use POST
            /api/v1/encounters/{id}/documents."
      security:
        - bearerAuth: []
